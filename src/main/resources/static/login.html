<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Valorant Coach AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0f1117; }</style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col">

<header class="relative border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-red-500"></div>
        <a href="/" class="text-xl font-bold tracking-widest uppercase text-white">Valorant Coach <span class="text-red-500">AI</span></a>
    </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">

        <!-- Tabs -->
        <div class="flex mb-6 bg-gray-800 rounded-xl p-1">
            <button id="tab-login" onclick="switchTab('login')"
                class="flex-1 py-2 rounded-lg text-sm font-bold uppercase tracking-wider transition-all bg-red-500 text-white">
                Connexion
            </button>
            <button id="tab-register" onclick="switchTab('register')"
                class="flex-1 py-2 rounded-lg text-sm font-bold uppercase tracking-wider transition-all text-gray-400">
                Inscription
            </button>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
            <div id="error-msg" class="hidden bg-red-900/30 border border-red-700 rounded p-3 text-red-300 text-sm mb-4"></div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 uppercase tracking-wider block mb-1">Email</label>
                    <input id="input-email" type="email" placeholder="ton@email.com"
                        class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-3 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 uppercase tracking-wider block mb-1">Mot de passe</label>
                    <input id="input-password" type="password" placeholder="••••••••"
                        class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-3 text-white focus:outline-none focus:border-red-500">
                </div>
                <button id="btn-submit" onclick="submit()"
                    class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded uppercase tracking-wider transition-colors">
                    Se connecter
                </button>
            </div>
        </div>

        <p class="text-center text-gray-600 text-xs mt-4">
            En continuant, tu acceptes nos conditions d'utilisation.
        </p>
    </div>
</main>

<script>
let mode = 'login';

function switchTab(tab) {
    mode = tab;
    document.getElementById('tab-login').className = tab === 'login'
        ? 'flex-1 py-2 rounded-lg text-sm font-bold uppercase tracking-wider transition-all bg-red-500 text-white'
        : 'flex-1 py-2 rounded-lg text-sm font-bold uppercase tracking-wider transition-all text-gray-400';
    document.getElementById('tab-register').className = tab === 'register'
        ? 'flex-1 py-2 rounded-lg text-sm font-bold uppercase tracking-wider transition-all bg-red-500 text-white'
        : 'flex-1 py-2 rounded-lg text-sm font-bold uppercase tracking-wider transition-all text-gray-400';
    document.getElementById('btn-submit').textContent = tab === 'login' ? 'Se connecter' : 'Créer mon compte';
    document.getElementById('error-msg').classList.add('hidden');
}

async function submit() {
    const email    = document.getElementById('input-email').value.trim();
    const password = document.getElementById('input-password').value;
    const errEl    = document.getElementById('error-msg');

    if (!email || !password) { showError('Remplis tous les champs.'); return; }
    if (password.length < 6) { showError('Mot de passe trop court (min 6 caractères).'); return; }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Chargement...';

    try {
        const res = await fetch(`/api/auth/${mode}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
            const msg = mode === 'login' ? 'Email ou mot de passe incorrect.' : 'Cet email est déjà utilisé.';
            showError(msg);
            return;
        }

        const data = await res.json();
        localStorage.setItem('valo_token', data.token);
        localStorage.setItem('valo_email', data.email);
        localStorage.setItem('valo_subscribed', data.subscribed);
        window.location.href = '/';
    } catch (e) {
        showError('Erreur réseau. Réessaie.');
    } finally {
        btn.disabled = false;
        btn.textContent = mode === 'login' ? 'Se connecter' : 'Créer mon compte';
    }
}

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.remove('hidden');
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
