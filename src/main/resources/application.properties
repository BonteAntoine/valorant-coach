riot.api.key=${RIOT_API_KEY}
anthropic.api.key=${ANTHROPIC_API_KEY}
server.port=8080

# Database (H2 local, PostgreSQL sur Railway via DATABASE_URL)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:valorantdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:valorantCoachSecretKey2024XYZ123456789ABCDEF}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.price.id=${STRIPE_PRICE_ID:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# App URL (pour les redirections Stripe)
app.url=${APP_URL:http://localhost:8080}
